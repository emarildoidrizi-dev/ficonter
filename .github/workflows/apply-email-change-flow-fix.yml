name: Apply Email Change Fix

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-change-flow-production
      - name: Patch production email change flow
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("components/SettingsWorkspace.tsx"); s=p.read_text(); s=s.replace("return `${window.location.origin}/auth/callback?next=${next}`;", "return `https://www.ficonter.com/auth/callback?next=${next}`;", 1); s=s.replace("email: pendingEmail,\n        options: { emailRedirectTo: emailChangeRedirectUrl() },", "email: currentEmail,\n        options: { emailRedirectTo: emailChangeRedirectUrl() },", 1); p.write_text(s)'
          rm .github/workflows/apply-email-change-flow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SettingsWorkspace.tsx .github/workflows/apply-email-change-flow-fix.yml
          git commit -m "fix(auth): correct email change resend target and redirect"
          git push origin HEAD:fix/email-change-flow-production
