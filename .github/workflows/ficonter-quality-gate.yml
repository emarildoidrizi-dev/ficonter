name: FICONTER quality gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chore/database-contract-hardening

permissions:
  contents: read

concurrency:
  group: ficonter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      FICONTER_SUPER_ADMIN_EMAIL: ci@example.invalid
      OPENAI_MODEL: gpt-5-mini

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify database and application contracts
        run: npm run verify:hardening

      - name: Verify production resilience contract
        if: always()
        run: npm run verify:resilience

      - name: Lint
        if: always()
        run: npm run lint

      - name: Build and type-check application
        if: always()
        run: npm run build
