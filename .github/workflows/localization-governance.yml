name: Localization Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify complete localization
        run: npm run verify:localization
