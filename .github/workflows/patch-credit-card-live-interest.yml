name: One-time credit card live interest patch

on:
  push:
    branches:
      - feature/e2ee-zero-knowledge
    paths:
      - .github/workflows/patch-credit-card-live-interest.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/e2ee-zero-knowledge
          fetch-depth: 0
      - name: Patch live interest tile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/CreditCardsManager.tsx')
          text = path.read_text()
          old = '''                  <div>
                    <span>Interest charged</span>
                    <strong>{displayMoney(metrics.interest)}</strong>
                    <small>
                      {finiteNumber(card.annual_interest_rate).toFixed(2)}% APR · ~
                      {displayMoney(estimatedInterest)} estimated monthly
                    </small>
                  </div>'''
          new = '''                  <div>
                    <span>Real-time interest charge</span>
                    <strong>{displayMoney(estimatedInterest)}</strong>
                    <small>
                      {finiteNumber(card.annual_interest_rate).toFixed(2)}% APR · updates with Current balance
                    </small>
                  </div>'''
          if old not in text:
              raise SystemExit('Expected Credit Card interest tile was not found; no patch applied.')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-credit-card-live-interest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CreditCardsManager.tsx .github/workflows/patch-credit-card-live-interest.yml
          git commit -m "feat(credit-cards): show live APR interest charge"
          git push origin HEAD:feature/e2ee-zero-knowledge