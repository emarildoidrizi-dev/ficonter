name: Patch email resend reliability

on:
  push:
    branches:
      - fix/email-change-resend-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-change-resend-reliability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch SettingsWorkspace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/SettingsWorkspace.tsx')
          s = p.read_text()

          old = '''function emailChangeRedirectUrl() {
  if (typeof window === "undefined") return undefined;
  const next = encodeURIComponent("/dashboard/settings?section=profile");
  return `${window.location.origin}/auth/callback?next=${next}`;
}'''
          new = '''function emailChangeRedirectUrl() {
  const next = encodeURIComponent("/dashboard/settings?section=profile");
  return `https://www.ficonter.com/auth/callback?next=${next}`;
}'''
          if old in s:
            s = s.replace(old, new, 1)

          old_state = '''  const [emailRequesting, setEmailRequesting] = useState(false);
  const [emailResending, setEmailResending] = useState(false);'''
          new_state = '''  const [emailRequesting, setEmailRequesting] = useState(false);
  const [emailResending, setEmailResending] = useState(false);
  const [emailResendCooldown, setEmailResendCooldown] = useState(0);'''
          if old_state in s and 'emailResendCooldown' not in s:
            s = s.replace(old_state, new_state, 1)

          marker = '''  async function resendEmailChange() {
    if (!pendingEmail || emailResending) return;
    setEmailResending(true);
    setMessage(null);

    try {
      const { error } = await supabase.auth.resend({
        type: "email_change",
        email: pendingEmail,
        options: { emailRedirectTo: emailChangeRedirectUrl() },
      });
      if (error) throw error;
      showSuccess("A new confirmation link was sent to the pending email address.");
    } catch (error) {
      showError(error, "The confirmation link could not be resent.");
    } finally {
      setEmailResending(false);
    }
  }'''
          replacement = '''  useEffect(() => {
    if (emailResendCooldown <= 0) return;
    const timer = window.setInterval(() => {
      setEmailResendCooldown((current) => Math.max(0, current - 1));
    }, 1000);
    return () => window.clearInterval(timer);
  }, [emailResendCooldown]);

  async function resendEmailChange() {
    if (!pendingEmail || emailResending || emailResendCooldown > 0) return;
    setEmailResending(true);
    setMessage(null);

    try {
      const { data: userData, error: userError } = await supabase.auth.getUser();
      if (userError) throw userError;

      const identity = readEmailIdentity(userData.user as AuthIdentityUser | null, currentEmail, pendingEmail);
      if (!identity.pending) {
        setPendingEmail("");
        setAccountEmail(identity.current);
        showSuccess("There is no email change waiting for confirmation.");
        return;
      }

      setCurrentEmail(identity.current);
      setPendingEmail(identity.pending);
      setAccountEmail(identity.pending);

      const { error } = await supabase.auth.resend({
        type: "email_change",
        email: identity.pending,
        options: { emailRedirectTo: emailChangeRedirectUrl() },
      });
      if (error) throw error;

      setEmailResendCooldown(60);
      showSuccess("A new confirmation link was sent. For security, another resend is available in 60 seconds.");
    } catch (error) {
      const text = error instanceof Error ? error.message : String(error ?? "");
      if (/rate|too many|seconds|429/i.test(text)) {
        setEmailResendCooldown(60);
        setMessage({ type: "error", text: "Please wait about 60 seconds before requesting another confirmation email." });
      } else {
        showError(error, "The confirmation link could not be resent.");
      }
    } finally {
      setEmailResending(false);
    }
  }'''
          if marker in s:
            s = s.replace(marker, replacement, 1)

          old_button = '''<button type="button" className={styles.secondaryButton} disabled={emailResending} onClick={() => void resendEmailChange()}>{emailResending ? "Sending…" : "Resend link"}</button>'''
          new_button = '''<button type="button" className={styles.secondaryButton} disabled={emailResending || emailResendCooldown > 0} onClick={() => void resendEmailChange()}>{emailResending ? "Sending…" : emailResendCooldown > 0 ? `Resend in ${emailResendCooldown}s` : "Resend link"}</button>'''
          if old_button in s:
            s = s.replace(old_button, new_button, 1)

          p.write_text(s)
          PY
      - name: Update verification contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-profile-identity.mjs')
          s = p.read_text()
          needle = '[settings.includes(\'type: "email_change"\') && settings.includes("resendEmailChange"), "Pending email confirmation can be resent"],'
          if 'Email-change resend has visible cooldown and repeat support' not in s:
            replacement = needle + '\n  [settings.includes("emailResendCooldown") && settings.includes("Resend in ${emailResendCooldown}s"), "Email-change resend has visible cooldown and repeat support"],\n  [settings.includes("https://www.ficonter.com/auth/callback"), "Email-change confirmations always return to the public production domain"],'
            if needle not in s:
              raise SystemExit('verification insertion point not found')
            s = s.replace(needle, replacement, 1)
            p.write_text(s)
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet -- components/SettingsWorkspace.tsx scripts/verify-profile-identity.mjs; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SettingsWorkspace.tsx scripts/verify-profile-identity.mjs
          git commit -m "fix(auth): make email-change resend repeatable [email-resend-patched]"
          git push origin HEAD:fix/email-change-resend-reliability
