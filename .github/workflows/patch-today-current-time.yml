name: Patch today current time

on:
  push:
    branches:
      - fix/today-current-time

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-current-time
      - name: Patch transaction datetime pickers
        run: |
          python - <<'PY'
          from pathlib import Path

          def helper():
              return '''\nfunction currentLocalDateTimeValue(date = new Date()) {\n  const offset = date.getTimezoneOffset();\n  return new Date(date.getTime() - offset * 60_000).toISOString().slice(0, 16);\n}\n\nfunction dateTimePickerValue(previousValue: string, nextValue: string) {\n  const current = currentLocalDateTimeValue();\n  const today = current.slice(0, 10);\n  const previousDate = previousValue.slice(0, 10);\n  const nextDate = nextValue.slice(0, 10);\n\n  // Native datetime pickers keep the old time when their Today action changes\n  // only the calendar date. When that happens, use the real local time now.\n  if (nextDate === today && previousDate !== today) return current;\n  return nextValue;\n}\n'''

          # Edit transaction modal
          p = Path('components/TransactionLedger.tsx')
          s = p.read_text()
          anchor = '''const toLocalDateTimeInput = (value: string | null, fallbackDate: string) => {\n  const date = value ? new Date(value) : new Date(`${fallbackDate}T12:00:00`);\n  const offset = date.getTimezoneOffset();\n  return new Date(date.getTime() - offset * 60_000).toISOString().slice(0, 16);\n};\n'''
          if 'function dateTimePickerValue(' not in s:
              if anchor not in s:
                  raise SystemExit('Ledger helper anchor not found')
              s = s.replace(anchor, anchor + helper(), 1)
          old = 'onChange={(event) => setEditOccurredAt(event.target.value)}'
          new = 'onChange={(event) => setEditOccurredAt((current) => dateTimePickerValue(current, event.target.value))}'
          if old not in s and new not in s:
              raise SystemExit('Ledger datetime onChange not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Add transaction form: same Today behavior everywhere this shared form renders.
          p = Path('components/TransactionForm.tsx')
          s = p.read_text()
          anchor = '''function localDateTimeValue(date = new Date()) {\n  const offset = date.getTimezoneOffset();\n  return new Date(date.getTime() - offset * 60_000).toISOString().slice(0, 16);\n}\n'''
          extra = '''\nfunction dateTimePickerValue(previousValue: string, nextValue: string) {\n  const current = localDateTimeValue();\n  const today = current.slice(0, 10);\n  const previousDate = previousValue.slice(0, 10);\n  const nextDate = nextValue.slice(0, 10);\n\n  if (nextDate === today && previousDate !== today) return current;\n  return nextValue;\n}\n'''
          if 'function dateTimePickerValue(' not in s:
              if anchor not in s:
                  raise SystemExit('Form helper anchor not found')
              s = s.replace(anchor, anchor + extra, 1)
          old = '''transactionTimeWasEdited.current = true;\n                    setOccurredAt(event.target.value);'''
          new = '''transactionTimeWasEdited.current = true;\n                    setOccurredAt((current) => dateTimePickerValue(current, event.target.value));'''
          count = s.count(old)
          if count == 0 and 'dateTimePickerValue(current, event.target.value)' not in s:
              raise SystemExit('Form datetime onChange not found')
          s = s.replace(old, new)
          p.write_text(s)
          print(f'Updated TransactionForm datetime handlers: {count}')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/TransactionLedger.tsx components/TransactionForm.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(transactions): make Today use current local time"
          git push origin HEAD:fix/today-current-time
