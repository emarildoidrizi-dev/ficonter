name: Release Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-quality:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      FICONTER_SUPER_ADMIN_EMAIL: ci@example.invalid
      OPENAI_MODEL: gpt-5-mini

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify current production architecture
        run: npm run verify:production-core

      - name: Run legacy compatibility audit
        continue-on-error: true
        run: npm run verify:release-quality

      - name: Lint and type-check
        run: npm run lint && npm run typecheck

      - name: Build production application
        run: npm run build
