  <path d="M1196 619c45-72 91-107 138-103-15 37-17 70-5 101m84-13c35-73 75-112 120-117-9 44-4 84 16 121m62-7c24-57 58-87 102-90-9 35-3 67 16 96" fill="none" stroke="#426f5d" stroke-width="17" stroke-linecap="round"/>

