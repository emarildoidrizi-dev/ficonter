<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Coastal island morning</title>
  <desc id="description">A bright tropical shoreline with calm turquoise water, a distant island and palm leaves entering from above.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#dff5f1"/>
      <stop offset=".56" stop-color="#d4ece7"/>
      <stop offset="1" stop-color="#f3e6c9"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#73c9c2"/>
      <stop offset=".5" stop-color="#3ea9a6"/>
      <stop offset="1" stop-color="#257f84"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ead9b7"/>
      <stop offset="1" stop-color="#cfad78"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop stop-color="#fff8d9"/>
      <stop offset="1" stop-color="#e6c47d" stop-opacity=".15"/>
    </radialGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6f9877"/>
      <stop offset="1" stop-color="#3d6e61"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#315f52"/>
      <stop offset="1" stop-color="#5c8b69"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="650" fill="url(#sky)"/>
  <rect y="650" width="1920" height="430" fill="url(#water)"/>
  <circle cx="1510" cy="238" r="190" fill="url(#sun)"/>
  <circle cx="1510" cy="238" r="82" fill="#fff2c5" opacity=".72"/>

