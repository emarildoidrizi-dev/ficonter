<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#13231b" />
    <title>Ficonter · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        color: #f7f3e9;
        background:
          radial-gradient(circle at 20% 5%, #26382f 0, transparent 35%),
          linear-gradient(145deg, #08100d, #111b17);
      }
      main {
        width: min(100%, 520px);
        padding: 34px;
        border: 1px solid rgba(215, 188, 124, 0.28);
        border-radius: 24px;
        background: rgba(13, 23, 19, 0.94);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      .eyebrow {
        display: block;
        margin-top: 24px;
        color: #d8bd7c;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 8vw, 54px);
        line-height: 1;
      }
      p {
        margin: 0;
        color: #c8cec9;
        font-size: 15px;
        line-height: 1.7;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 1px solid #d8bd7c;
        border-radius: 14px;
        color: #111b17;
        background: #d8bd7c;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/icons/ficonter-192.png"
        alt="Ficonter"
        width="72"
        height="72"
      />
      <span class="eyebrow">Connection required</span>
      <h1>You are offline.</h1>
      <p>
        Reconnect to continue with your latest synchronized Ficonter
        information. Private financial pages are not stored for
        offline editing.
      </p>
      <button type="button" onclick="window.location.reload()">
        Try again
      </button>
    </main>
  </body>
</html>
